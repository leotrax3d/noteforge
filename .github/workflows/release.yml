name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Auto-Update (docs/RELEASE.md): mit Repo-Variable TAURI_UPDATER_PUBKEY und Secret TAURI_SIGNING_PRIVATE_KEY
      # wird der Updater eingebaut, die Installer signiert und latest.json hochgeladen.
      - name: Updater-Konfiguration
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$PUBKEY" ] && [ "$HAS_KEY" = "true" ]; then
            node -e 'require("fs").writeFileSync("src-tauri/tauri.updater.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY,endpoints:["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"],windows:{installMode:"passive"}}}}))'
            echo "TAURI_ARGS=--config src-tauri/tauri.updater.json" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Updater-Schlüssel – Release ohne Auto-Update (siehe docs/RELEASE.md)"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ env.TAURI_ARGS }}
          includeUpdaterJson: true
          tagName: v__VERSION__  # Tag legt die Action an (Version aus tauri.conf.json)
          releaseName: "Noteforge v__VERSION__"
          # Wird im Update-Dialog als Changelog angezeigt
          releaseBody: |
            Windows-Installer zum Ausprobieren (noch nicht signiert – SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“).
            - `Noteforge_*_x64-setup.exe` (NSIS, Installation pro Benutzer, empfohlen)
            - `Noteforge_*_x64_de-DE.msi` (MSI)

            Neu in dieser Version:
            - Neues Design „Glas“ (hell und dunkel): halbtransparente, weichgezeichnete Leisten, Menüs, Dialoge und Kacheln; Fensterhintergrund Mica/Acrylic; optional eigenes Hintergrundbild
            - Einstellungen → Darstellung: Transparenz und Blur mit Live-Vorschau, Verhalten im Akkumodus, „Animationen reduzieren“
            - Lesbarkeit: Deckkraft wird automatisch für WCAG-AA-Kontrast erhöht; Windows-„Transparenzeffekte aus“ und Kontrastmodus werden beachtet
            - Stift bleibt schnell: Stiftleiste schreibt ohne Blur, schaltet danach weich zurück
          releaseDraft: false
          prerelease: false  # „latest“ muss auf das neueste Release zeigen (Update-Endpunkt)
