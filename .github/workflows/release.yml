name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Noteforge ${{ github.ref_name }}"
          releaseBody: |
            Windows-Installer zum Ausprobieren (noch nicht signiert – SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“).
            - `Noteforge_*_x64-setup.exe` (NSIS, Installation pro Benutzer, empfohlen)
            - `Noteforge_*_x64_de-DE.msi` (MSI)
          releaseDraft: false
          prerelease: true
