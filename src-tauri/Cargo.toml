[package]
name = "noteforge"
version = "0.2.4"
description = "Stiftoptimierte Schul-Notiz-App"
authors = ["Noteforge"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "noteforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }
thiserror = "2.0.21"
flate2 = "1.1.11"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "rustls-tls-native-roots", "http2", "charset"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
roxmltree = "0.21.2"
sha2 = "0.10"
url = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Phase 7: InkAnalyzer + Windows.Media.Ocr (WinRT)
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr",
  "Security_Cryptography", "Storage_Streams", "UI_Input_Inking", "UI_Input_Inking_Analysis",
  "Win32_System_WinRT", "Win32_System_Registry",
] }
# Fenstermaterial Mica/Acrylic (Glas-Design)
window-vibrancy = "0.6"
windows-collections = "0.3"
windows-numerics = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
